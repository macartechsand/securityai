# Render Blueprint for the backend API (FastAPI). The frontend is a static site deployed separately
# (see README.md > Deploy).
#
# GEMINI_API_KEY and CORS_ORIGINS have sync: false: Render asks for them in the dashboard and they
# never live in the repository.
services:
  - type: web
    name: macartech-security-ai-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.5-flash-lite
      - key: GEMINI_THINKING_LEVEL
        value: minimal
      # Render terminates TLS in front of the app, so the client IP arrives in X-Forwarded-For.
      - key: TRUST_PROXY_HEADERS
        value: "true"
      # Daily caps: keep DAILY_LIMIT_GLOBAL below the Gemini requests-per-day quota.
      - key: DAILY_LIMIT_PER_USER
        value: "20"
      - key: DAILY_LIMIT_GLOBAL
        value: "400"
      - key: PYTHON_VERSION
        value: "3.12.7"
